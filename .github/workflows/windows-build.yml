name: Windows Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install vcpkg
        shell: powershell
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:GITHUB_WORKSPACE\vcpkg
          & $env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat

      - name: Install Boost (vcpkg)
        shell: powershell
        run: |
          $triplet = "x64-windows"
          & $env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe install `
            boost-asio:$triplet `
            boost-foreach:$triplet `
            boost-crc:$triplet `
            boost-multi-index:$triplet `
            boost-uuid:$triplet `
            boost-scope-exit:$triplet `
            boost-system:$triplet `
            boost-filesystem:$triplet `
            boost-thread:$triplet `
            boost-date-time:$triplet `
            boost-chrono:$triplet `
            boost-regex:$triplet `
            boost-serialization:$triplet `
            boost-program-options:$triplet

      - name: Configure
        shell: powershell
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build (Release)
        shell: powershell
        run: |
          cmake --build build --config Release -- /m

      - name: Package
        shell: powershell
        run: |
          $dist = "$env:GITHUB_WORKSPACE\dist\citadel_network_v1.0"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $binDir = "$env:GITHUB_WORKSPACE\build\src\Release"
          Copy-Item "$binDir\citadeld.exe" $dist
          Copy-Item "$binDir\citadelwallet.exe" $dist
          Copy-Item "$binDir\walletd.exe" $dist
          Copy-Item "$binDir\miner.exe" $dist

          $vcpkgBin = "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin\*.dll" $dist -ErrorAction SilentlyContinue
          }

          Compress-Archive -Path "$dist\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\citadel_network_v1.0.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: citadel_network_v1.0
          path: dist/citadel_network_v1.0.zip
